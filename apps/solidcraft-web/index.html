  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #1e2024;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #solidcraft_canvas {
      display: block;
      width: 100vw !important;
      height: 100dvh !important;
      touch-action: none;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading SolidCraft&hellip;</span></div>
  <script>
    // Ensure no stale ServiceWorker intercepts requests or triggers net::ERR_CACHE_MISS in Android WebView.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const r of regs) {
          r.unregister().catch(() => {});
        }
      }).catch(() => {});
    }

    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });

    // Android APK Native Download Bridge for blob: exports (.stl, .step, .3mf, .dxf, .svg, .solidcraft)
    (function() {
      // Fix eframe ResizeObserver DPI mismatch on mobile WebViews & high-DPI displays (S26 Ultra)
      // and keep WebGL2/WebGPU framebuffer within 2048px downlevel texture limits.
      try {
        if (typeof ResizeObserverEntry !== 'undefined' && ResizeObserverEntry.prototype) {
          delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
        }
        var rawDpr = window.devicePixelRatio || 1;
        Object.defineProperty(window, 'devicePixelRatio', {
          get: function() {
            var m = Math.max(window.innerWidth || 848, window.innerHeight || 848, 1);
            var cap = Math.floor((2040 / m) * 100) / 100;
            return Math.max(1, Math.min(rawDpr, cap));
          },
          configurable: true
        });
      } catch (e) {}
      const origClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (window.SolidCraftAndroid && typeof window.SolidCraftAndroid.saveDownloadedFile === "function" && this.href && this.href.startsWith("blob:")) {
          const fileName = this.download || "design.solidcraft";
          const blobUrl = this.href;
          fetch(blobUrl)
            .then((r) => r.blob())
            .then((blob) => {
              const reader = new FileReader();
              reader.onloadend = () => {
                const res = String(reader.result || "");
                const idx = res.indexOf(",");
                const b64 = idx >= 0 ? res.slice(idx + 1) : res;
                window.SolidCraftAndroid.saveDownloadedFile(fileName, b64);
              };
              reader.readAsDataURL(blob);
            })
            .catch(() => origClick.apply(this, arguments));
          return;
        }
        return origClick.apply(this, arguments);
      };
    })();

    // Multi-Touch Gesture Bridge for Samsung Galaxy S26 Ultra (2-finger pinch zoom & 2-finger pan)
    (function() {
      const canvas = document.getElementById("solidcraft_canvas");
      if (!canvas) return;
      let twoFingerActive = false;
      let prevMidX = 0;
      let prevMidY = 0;
      let prevDist = 0;

      function touchMetrics(t0, t1) {
        const mx = (t0.clientX + t1.clientX) * 0.5;
        const my = (t0.clientY + t1.clientY) * 0.5;
        const dx = t1.clientX - t0.clientX;
        const dy = t1.clientY - t0.clientY;
        return { mx, my, dist: Math.hypot(dx, dy) };
      }

      canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          twoFingerActive = true;
          const m = touchMetrics(e.touches[0], e.touches[1]);
          prevMidX = m.mx;
          prevMidY = m.my;
          prevDist = m.dist;
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && twoFingerActive) {
          const m = touchMetrics(e.touches[0], e.touches[1]);
          const dx = m.mx - prevMidX;
          const dy = m.my - prevMidY;
          const dDist = m.dist - prevDist;
          prevMidX = m.mx;
          prevMidY = m.my;
          prevDist = m.dist;

          if (Math.abs(dx) > 0.2 || Math.abs(dy) > 0.2) {
            const panX = Math.abs(dx) < 0.01 ? 0.01 : -dx;
            canvas.dispatchEvent(new WheelEvent("wheel", {
              deltaMode: 0,
              deltaX: panX,
              deltaY: -dy,
              ctrlKey: false,
              clientX: m.mx,
              clientY: m.my,
              bubbles: true,
              cancelable: true
            }));
          }
          if (Math.abs(dDist) > 0.4) {
            canvas.dispatchEvent(new WheelEvent("wheel", {
              deltaMode: 0,
              deltaX: 0,
              deltaY: -dDist * 2.0,
              ctrlKey: true,
              clientX: m.mx,
              clientY: m.my,
              bubbles: true,
              cancelable: true
            }));
          }
          e.preventDefault();
        }
      }, { passive: false });

      const endTwoFinger = (e) => {
        if (e.touches.length < 2) {
          twoFingerActive = false;
        }
      };
      canvas.addEventListener("touchend", endTwoFinger, { passive: true });
      canvas.addEventListener("touchcancel", endTwoFinger, { passive: true });
    })();
  </script>
</body>
</html>
